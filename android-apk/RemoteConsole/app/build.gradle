apply plugin: 'com.android.application'

android {
    namespace 'com.example.remoteconsole'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.remoteconsole"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 本应用仅用系统 WebView，无需第三方依赖
}
